# This workflow is managed by gh actions-lock.

name: GuideSite Pipeline
on:
  workflow_call:
    inputs:
      source-ref:
        required: true
        type: string
      policy-path:
        required: true
        type: string
      site-name:
        required: true
        type: string
      target:
        type: string
        default: preview
      site-url:
        description: Absolute public URL for the selected site environment
        type: string
        default: ''
      platform-release:
        description: Published release tag; omit to resolve the unique release matching platform-commit. Mutually exclusive with a candidate ZIP URL.
        default: ''
        type: string
      platform-package-url:
        description: HTTPS ZIP URL containing candidate release assets from the platform build.
        type: string
        default: ''
      platform-package-sha256:
        description: SHA256 of the candidate ZIP supplied by the platform build.
        type: string
        default: ''
      platform-version:
        description: Expected candidate version supplied by the platform build.
        type: string
        default: ''
      platform-commit:
        description: Platform source identity recorded in the release manifest
        required: true
        type: string
      deploy:
        description: Explicitly enable deployment to the configured site environment
        type: boolean
        default: false
      deployment-environment:
        description: Azure Static Web Apps named environment; empty only for production
        type: string
        default: ''
    secrets:
      static-web-app-token:
        required: false
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: pwsh
env:
  SITE_POLICY: ${{ inputs.policy-path }}
  SITE_TARGET: ${{ inputs.target }}
  SITE_BASE_URL: ${{ inputs.site-url }}
  PLATFORM_RELEASE: ${{ inputs.platform-release }}
  PLATFORM_COMMIT: ${{ inputs.platform-commit }}
  PLATFORM_PACKAGE_URL: ${{ inputs.platform-package-url }}
  PLATFORM_PACKAGE_SHA256: ${{ inputs.platform-package-sha256 }}
  PLATFORM_VERSION: ${{ inputs.platform-version }}
jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref }}
          persist-credentials: false
      - name: Get platform installer
        uses: actions/checkout@v4
        with:
          repository: nkdAgility/OpenGuidePlatform
          ref: ${{ inputs.platform-commit }}
          path: .processing/platform-installer
          sparse-checkout: .build/Restore-OpenGuidePlatform.ps1
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ vars.HUGO_BUILD_VERSION || 'latest' }}
          extended: true
      - uses: actions/setup-go@v5
        with:
          go-version: '>=1.24.5'
          cache: false
      - name: Restore and verify OpenGuidePlatform
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.processing/platform-installer/.build/Restore-OpenGuidePlatform.ps1 -FromWorkflow -ExpectedCommit $env:PLATFORM_COMMIT -OutputPath .processing/platform
      - name: Install guide-site preparation dependencies
        run: Install-Module powershell-yaml -MinimumVersion 0.4.12 -Scope CurrentUser -Force -Repository PSGallery
      - name: Prepare guide site
        run: ./.processing/platform/build.ps1 -Product GuideSite -Stage Prepare -BaseUrl $env:SITE_BASE_URL -WorkspaceRoot $PWD -PolicyPath $env:SITE_POLICY -Target $env:SITE_TARGET -OutputPath .processing/guide-site
      - name: Retain Prepare report for PR delivery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GuideSite-Assessment-${{ inputs.target }}
          path: |
            .processing/guide-site/prepare/assessment.json
            .processing/guide-site/prepare/assessment.md
          if-no-files-found: error
      - name: Retain prepared context and assessment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GuideSite-Prepare-${{ inputs.target }}
          include-hidden-files: true
          path: |
            .processing/platform/
            .processing/guide-site/
            .processing/i18n-probe/
          if-no-files-found: error
  prepare-report:
    name: Prepare report
    needs: prepare
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      pull-requests: write
    steps:
      # Restore platform code separately; the site supplies assessment data only.
      - name: Get platform installer
        uses: actions/checkout@v4
        with:
          repository: nkdAgility/OpenGuidePlatform
          ref: ${{ inputs.platform-commit }}
          path: .processing/platform-installer
          sparse-checkout: .build/Restore-OpenGuidePlatform.ps1
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Restore and verify OpenGuidePlatform
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.processing/platform-installer/.build/Restore-OpenGuidePlatform.ps1 -FromWorkflow -ExpectedCommit $env:PLATFORM_COMMIT -OutputPath .processing/platform
      - uses: actions/download-artifact@v4
        with:
          name: GuideSite-Assessment-${{ inputs.target }}
          path: assessment
      - name: Deliver commit-scoped Prepare assessment
        env:
          GH_TOKEN: ${{ github.token }}
          ASSESSED_COMMIT: ${{ inputs.source-ref }}
          ASSESSED_TARGET: ${{ inputs.target }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
        run: ./.processing/platform/system/OpenGuidePlatform.PowerShell.Build/GitHubActions/Invoke-GuideSiteGitHubAction.ps1 -Operation PublishPrepare

  build:
    name: Build
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref }}
          persist-credentials: false
      - name: Restore prepared platform and site context
        uses: actions/download-artifact@v4
        with:
          name: GuideSite-Prepare-${{ inputs.target }}
          path: .processing
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ vars.HUGO_BUILD_VERSION || 'latest' }}
          extended: true
      - uses: actions/setup-go@v5
        with:
          go-version: '>=1.24.5'
          cache: false
      - name: Build guide site
        run: ./.processing/platform/build.ps1 -Product GuideSite -Stage Build -WorkspaceRoot $PWD -PolicyPath $env:SITE_POLICY -Target $env:SITE_TARGET -OutputPath .processing/guide-site
      - name: Retain built artifact and identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GuideSite-Build-${{ inputs.target }}
          include-hidden-files: true
          path: .processing/guide-site/
          if-no-files-found: error
  validate:
    name: Validate
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref }}
          persist-credentials: false
      - name: Restore prepared platform and site context
        uses: actions/download-artifact@v4
        with:
          name: GuideSite-Prepare-${{ inputs.target }}
          path: .processing
      - name: Download built guide site
        uses: actions/download-artifact@v4
        with:
          name: GuideSite-Build-${{ inputs.target }}
          path: .processing/guide-site
      - name: Validate guide site
        run: ./.processing/platform/build.ps1 -Product GuideSite -Stage Validate -WorkspaceRoot $PWD -PolicyPath $env:SITE_POLICY -Target $env:SITE_TARGET -OutputPath .processing/guide-site
      - name: Check deployment inputs without deployment credentials
        if: ${{ inputs.deploy }}
        env:
          SITE_DEPLOYMENT_ENVIRONMENT: ${{ inputs.deployment-environment }}
        run: ./.processing/platform/build.ps1 -Product GuideSite -Stage Deploy -WorkspaceRoot $PWD -PolicyPath $env:SITE_POLICY -Target $env:SITE_TARGET -OutputPath .processing/guide-site -DeploymentEnvironment $env:SITE_DEPLOYMENT_ENVIRONMENT
      - name: Retain validated deployment files
        if: ${{ inputs.deploy }}
        uses: actions/upload-artifact@v4
        with:
          name: GuideSite-Deployment-${{ inputs.target }}
          include-hidden-files: true
          path: |
            .processing/guide-site/site/
            .processing/guide-site/artifact-identity.json
            .processing/guide-site/artifact-validation.json
          if-no-files-found: error
      - name: Retain artifact validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GuideSite-Validate-${{ inputs.target }}
          path: |
            .processing/guide-site/artifact-validation.json
            .processing/guide-site/download-requirements.json
            .processing/guide-site/runtime-anchor-validation.json
            .processing/guide-site/runtime/
          if-no-files-found: error
  deploy:
    name: Deploy
    permissions:
      actions: read
      contents: read
      pull-requests: write
    needs: validate
    if: ${{ inputs.deploy && github.event_name != 'merge_group' }}
    runs-on: ubuntu-24.04
    outputs:
      url: ${{ steps.hosting.outputs.static_web_app_url }}
    steps:
      # Restore platform code separately; never execute code from the site artifact.
      - name: Get platform installer
        uses: actions/checkout@v4
        with:
          repository: nkdAgility/OpenGuidePlatform
          ref: ${{ inputs.platform-commit }}
          path: .processing/platform-installer
          sparse-checkout: .build/Restore-OpenGuidePlatform.ps1
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Restore and verify OpenGuidePlatform
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.processing/platform-installer/.build/Restore-OpenGuidePlatform.ps1 -FromWorkflow -ExpectedCommit $env:PLATFORM_COMMIT -OutputPath .processing/platform
      - uses: actions/download-artifact@v4
        with:
          name: GuideSite-Deployment-${{ inputs.target }}
          path: deployment
      - name: Verify deployment data before exposing hosting credentials
        env:
          EXPECTED_COMMIT: ${{ inputs.source-ref }}
          EXPECTED_TARGET: ${{ inputs.target }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.deployment-environment }}
        run: ./.processing/platform/system/OpenGuidePlatform.PowerShell.Build/GitHubActions/Invoke-GuideSiteGitHubAction.ps1 -Operation ConfirmDeployment
      - name: Upload validated site to Azure Static Web Apps
        id: hosting
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.static-web-app-token }}
          repo_token: ${{ github.token }}
          action: upload
          app_location: deployment/site
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          deployment_environment: ${{ inputs.deployment-environment }}
  verify:
    name: Verify
    needs: deploy
    if: ${{ inputs.deploy && needs.deploy.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      SITE_DEPLOYMENT_URL: ${{ needs.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref }}
          persist-credentials: false
      - name: Restore prepared platform and site context
        uses: actions/download-artifact@v4
        with:
          name: GuideSite-Prepare-${{ inputs.target }}
          path: .processing
      - name: Download built guide site
        uses: actions/download-artifact@v4
        with:
          name: GuideSite-Build-${{ inputs.target }}
          path: .processing/guide-site
      - name: Download validation evidence
        uses: actions/download-artifact@v4
        with:
          name: GuideSite-Validate-${{ inputs.target }}
          path: .processing/guide-site
      - name: Verify guide site
        run: ./.processing/platform/build.ps1 -Product GuideSite -Stage Verify -WorkspaceRoot $PWD -PolicyPath $env:SITE_POLICY -Target $env:SITE_TARGET -OutputPath .processing/guide-site -DeploymentUrl $env:SITE_DEPLOYMENT_URL
      - name: Retain deployed-site verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GuideSite-Verify-${{ inputs.target }}
          path: .processing/guide-site/deployment-verification.json
          if-no-files-found: error
