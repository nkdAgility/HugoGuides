name: Build & Release (GuideSiteSample)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: One build target for this run
        type: choice
        options: [preview, production]
        default: preview
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: guide-site-sample-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  sample:
    name: GuideSiteSample
    uses: ./.github/workflows/guide-site-build.yaml
    with:
      source-ref: ${{ github.event.pull_request.head.sha || github.sha }}
      policy-path: examples/reference-guide-site/guide-site.policy.json
      site-name: GuideSiteSample
      target: ${{ (inputs.target || 'preview') }}
      site-url: ${{ (inputs.target || 'preview') == 'production' && 'https://blue-field-06cea8c03.6.azurestaticapps.net/' || (github.event_name == 'pull_request' && format('https://blue-field-06cea8c03-{0}.westeurope.6.azurestaticapps.net/', github.event.pull_request.number) || 'https://blue-field-06cea8c03-preview.westeurope.6.azurestaticapps.net/') }}
      platform-commit: ${{ github.event.pull_request.head.sha || github.sha }}
      deploy: ${{ (inputs.target || 'preview') == 'preview' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
      deployment-environment: ${{ github.event_name == 'pull_request' && format('{0}', github.event.pull_request.number) || 'preview' }}
    secrets:
      static-web-app-token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLUE_FIELD_06CEA8C03 }}