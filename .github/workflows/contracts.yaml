name: Platform contracts
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/open-guide-platform]
permissions:
  contents: read
jobs:
  contracts:
    name: Contract validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Validate contracts and failure cases
        shell: pwsh
        run: ./.build/Test-PlatformContracts.ps1
