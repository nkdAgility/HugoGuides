name: Build & Release (OpenGuidePlatform)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Sample validation target; production does not deploy
        type: choice
        options: [preview, production]
        default: preview
permissions:
  contents: read
  actions: read
  pull-requests: write
concurrency:
  group: open-guide-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: pwsh
jobs:
  build:
    name: Build and package OpenGuidePlatform
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.gitversion.outputs.semVer }}
      source-commit: ${{ steps.gitversion.outputs.sha }}
      artifact-id: ${{ steps.assets.outputs.artifact-id }}
      package-url: ${{ format('https://api.github.com/repos/{0}/actions/artifacts/{1}/zip', github.repository, steps.assets.outputs.artifact-id) }}
      package-sha256: ${{ steps.assets.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '5.x'
      - name: Calculate release version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3
        with:
          useConfigFile: true
          configFilePath: .github/GitVersion.yml
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ vars.HUGO_BUILD_VERSION || 'latest' }}
          extended: true
      - uses: actions/setup-go@v5
        with:
          go-version: '>=1.24.5'
          cache: false
      - name: Install build dependencies
        run: ./.build/Install-PlatformTestDependencies.ps1
      - name: Build, package and verify distribution
        env:
          PLATFORM_VERSION: ${{ steps.gitversion.outputs.semVer }}
        run: ./build.ps1 -Version $env:PLATFORM_VERSION -OutputPath .processing/platform-package
      - name: Retain candidate release assets
        id: assets
        uses: actions/upload-artifact@v4
        with:
          name: OpenGuidePlatform-ReleaseAssets
          path: |
            .processing/platform-package/OpenGuidePlatform.zip
            .processing/platform-package/release-manifest.json
            .processing/platform-package/bootstrap.ps1
          if-no-files-found: error
  sample:
    name: Validate GuideSiteSample before publication
    needs: build
    uses: ./.github/workflows/guide-site-build.yaml
    with:
      source-ref: ${{ needs.build.outputs.source-commit }}
      policy-path: examples/reference-guide-site/guide-site.policy.json
      site-name: GuideSiteSample
      site-url: ${{ (inputs.target || 'preview') == 'production' && 'https://blue-field-06cea8c03.6.azurestaticapps.net/' || (github.event_name == 'pull_request' && format('https://blue-field-06cea8c03-{0}.westeurope.6.azurestaticapps.net/', github.event.pull_request.number) || 'https://blue-field-06cea8c03-preview.westeurope.6.azurestaticapps.net/') }}
      deploy: ${{ (inputs.target || 'preview') == 'preview' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
      deployment-environment: ${{ github.event_name == 'pull_request' && format('{0}', github.event.pull_request.number) || 'preview' }}
      platform-commit: ${{ needs.build.outputs.source-commit }}
      platform-version: ${{ needs.build.outputs.version }}
      platform-package-url: ${{ needs.build.outputs.package-url }}
      platform-package-sha256: ${{ needs.build.outputs.package-sha256 }}
      target: ${{ inputs.target || 'preview' }}
    secrets:
      static-web-app-token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLUE_FIELD_06CEA8C03 }}
  release:
    name: Publish OpenGuidePlatform GitHub Release
    needs: [build, sample]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source-commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: .processing/platform-release
      - name: Publish and verify preview release
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM_VERSION: ${{ needs.build.outputs.version }}
        run: |
          ./build.ps1 -Stage Release -OutputPath .processing/platform-release
          ./build.ps1 -Stage Validate -ReleaseTag "v$env:PLATFORM_VERSION" -OutputPath .processing/published-platform
