name: Build & Release (OpenGuidePlatform)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: open-guide-platform-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: pwsh
jobs:
  build:
    name: Build and package OpenGuidePlatform
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.gitversion.outputs.semVer }}
      source-commit: ${{ steps.gitversion.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '5.x'
      - name: Calculate release version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3
        with:
          useConfigFile: true
          configFilePath: .github/GitVersion.yml
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ vars.HUGO_BUILD_VERSION || 'latest' }}
          extended: true
      - uses: actions/setup-go@v5
        with:
          go-version: '>=1.24.5'
          cache: false
      - name: Install build dependencies
        run: ./.build/Install-PlatformTestDependencies.ps1
      - name: Build, package and verify distribution
        env:
          PLATFORM_VERSION: ${{ steps.gitversion.outputs.semVer }}
        run: ./build.ps1 -Version $env:PLATFORM_VERSION -OutputPath .processing/platform-package
      - name: Retain release assets
        uses: actions/upload-artifact@v4
        with:
          name: OpenGuidePlatform-ReleaseAssets
          path: |
            .processing/platform-package/OpenGuidePlatform.zip
            .processing/platform-package/release-manifest.json
          if-no-files-found: error
  release:
    name: Publish OpenGuidePlatform GitHub Release
    needs: build
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source-commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: OpenGuidePlatform-ReleaseAssets
          path: .processing/platform-release
      - name: Publish and verify preview release
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM_VERSION: ${{ needs.build.outputs.version }}
        run: |
          ./build.ps1 -Stage Release -OutputPath .processing/platform-release
          ./build.ps1 -Stage Validate -ReleaseTag "v$env:PLATFORM_VERSION" -OutputPath .processing/published-platform
