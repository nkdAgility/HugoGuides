name: Build & Release (HugoGuides)

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: ["main"]
    tags-ignore: ["v*-*"]
  pull_request:
    branches: ["main"]
  merge_group:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  # Prepare
  Prepare:
    name: "Prepare"
    runs-on: ubuntu-latest
    outputs:
      GitVersion_BranchName: ${{ steps.gitversion.outputs.GitVersion_BranchName }}
      GitVersion_SemVer: ${{ steps.gitversion.outputs.GitVersion_SemVer }}
      GitVersion_PreReleaseLabel: ${{ steps.gitversion.outputs.GitVersion_PreReleaseLabel }}
      GitVersion_AssemblySemVer: ${{ steps.gitversion.outputs.GitVersion_AssemblySemVer }}
      GitVersion_InformationalVersion: ${{ steps.gitversion.outputs.GitVersion_InformationalVersion }}
      GitVersion_NuGetVersion: ${{ steps.gitversion.outputs.GitVersion_NuGetVersion }}
      GitVersion_PreReleaseNumber: ${{ steps.gitversion.outputs.GitVersion_PreReleaseNumber }}
      GitVersion_MajorMinorPatch: ${{ steps.gitversion.outputs.GitVersion_MajorMinorPatch }}
      HugoGuides_Ring: ${{ steps.HugoGuides.outputs.Ring }}
      HugoGuides_AzureSitesEnvironment: ${{ steps.HugoGuides.outputs.AzureSitesEnvironment }}
      HugoGuides_AzureSitesConfig: ${{ steps.HugoGuides.outputs.AzureSitesConfig }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3.0.0
        with:
          versionSpec: "5.x"
          includePrerelease: true
      - name: Execute GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3.0.0
        with:
          useConfigFile: true
          configFilePath: .github/GitVersion.yml
      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "${{ vars.HUGO_BUILD_VERSION }}"
          extended: true
      - name: Install validation dependencies
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -Repository PSGallery
          Install-Module powershell-yaml -RequiredVersion 0.4.12 -Scope CurrentUser -Force -Repository PSGallery
      - name: Prepare platform
        run: ./build.ps1 -Stage Prepare
      - name: Resolve build context
        id: HugoGuides
        env:
          GUIDE_EVENT_NAME: ${{ github.event_name }}
          GUIDE_PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
          GUIDE_PRERELEASE_LABEL: ${{ steps.gitversion.outputs.PreReleaseLabel }}
          GUIDE_PRODUCTION_ENVIRONMENT: ${{ vars.PRODUCTION_ENVIRONMENT_STATIC_SITES }}
        run: |
          ./.build/Write-PlatformRunContext.ps1 -EventName $env:GUIDE_EVENT_NAME -PullRequestNumber ([int]$env:GUIDE_PR_NUMBER) -PreReleaseLabel $env:GUIDE_PRERELEASE_LABEL -ProductionEnvironment $env:GUIDE_PRODUCTION_ENVIRONMENT
  # Build Docs
  BuildSite:
    name: "Build Site"
    runs-on: ubuntu-latest
    if: ${{ success() }}
    needs: [Prepare]
    env:
      GitVersion_SemVer: ${{ needs.Prepare.outputs.GitVersion_SemVer }}
      GitVersion_AssemblySemVer: ${{ needs.Prepare.outputs.GitVersion_AssemblySemVer }}
      GitVersion_InformationalVersion: ${{ needs.Prepare.outputs.GitVersion_InformationalVersion }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # Fetch Hugo themes (true OR recursive)
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "${{ vars.HUGO_BUILD_VERSION }}"
          extended: true

      - name: Build and validate platform artifact
        env:
          GUIDE_BUILD_TARGET: ${{ needs.Prepare.outputs.HugoGuides_AzureSitesConfig }}
          GUIDE_BUILD_VERSION: ${{ needs.Prepare.outputs.GitVersion_SemVer }}
        run: |
          ./build.ps1 -Stage Build -Target $env:GUIDE_BUILD_TARGET -Version $env:GUIDE_BUILD_VERSION -OutputPath .processing/ci-build
          ./build.ps1 -Stage Validate -Target $env:GUIDE_BUILD_TARGET -OutputPath .processing/ci-build
      - name: Report artifact validation
        if: always()
        run: ./.build/Write-ArtifactSummary.ps1 -OutputPath .processing/ci-build

      - name: Retain build and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Site-Evidence
          if-no-files-found: warn
          path: |
            ./.processing/ci-build/artifact-identity.json
            ./.processing/ci-build/artifact-validation.json
            ./.processing/ci-build/hugo.log
      - uses: actions/upload-artifact@v4
        with:
          name: Site
          path: ./.processing/ci-build/site/**/*

  # Release to Docs
  Publsh:
    name: "Publish Site"
    runs-on: ubuntu-latest
    needs: [Prepare, BuildSite]
    if: ${{ false }}
    outputs:
      static_web_app_url: ${{ steps.azureDeploy.outputs.static_web_app_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # Fetch Hugo themes (true OR recursive)
      - name: Download a single artifact
        uses: actions/download-artifact@v4
        with:
          name: Site
          path: ./_site

      - name: Build and Deploy
        uses: Azure/static-web-apps-deploy@v1
        id: azureDeploy
        env:
          VERBOSE: true
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: ./_site
          skip_app_build: true
          skip_api_build: false
          output_location: ""
          deployment_environment: ${{ (needs.Prepare.outputs.HugoGuides_AzureSitesEnvironment) }}
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_ISLAND_0C966E810ZZ }}

      - name: "Show Summery"
        if: always()
        shell: pwsh
        id: HugoGuides-summery
        run: |
          $markdown = @"
              ## ${{needs.Prepare.outputs.GitVersion_SemVer}} (${{needs.Prepare.outputs.HugoGuides_Ring}})
             Deployed to [${{steps.azureDeploy.outputs.static_web_app_url}}](${{steps.azureDeploy.outputs.static_web_app_url}})
          "@
          echo $markdown >> $Env:GITHUB_STEP_SUMMARY
