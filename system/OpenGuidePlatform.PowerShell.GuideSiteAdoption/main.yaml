# Site-owned caller. OGP updates its release reference; preserve site settings.
name: Build & Validate (GuideSite)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v[0-9]*', '[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  guide-site:
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: nkdAgility/OpenGuidePlatform/.github/workflows/guide-site-build.yaml@__RELEASE__
    with:
      source-ref: ${{ github.event.pull_request.head.sha || github.sha }}
      source-path: __SOURCE__
      deploy: false
